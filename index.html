<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업용 학생 추첨 원판 룰렛</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti (당첨 폭죽 효과) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Tone.js (효과음 생성) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Outfit:wght@400;600;800&display=swap');

    body {
      font-family: 'Gowun Dodum', 'Outfit', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    /* 룰렛 포인터 화살표 스타일 및 애니메이션 */
    .roulette-pointer {
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #ef4444;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      z-index: 20;
    }

    /* 회전 버튼 3D 누름 효과 */
    .btn-spin {
      box-shadow: 0 8px 0 #1d4ed8, 0 15px 20px rgba(0,0,0,0.2);
      transition: all 0.1s ease;
    }
    .btn-spin:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #1d4ed8, 0 8px 10px rgba(0,0,0,0.2);
    }
    .btn-spin:disabled {
      box-shadow: none;
      transform: translateY(4px);
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 p-3 sm:p-6">

  <!-- 상단 헤더 -->
  <header class="max-w-6xl w-full mx-auto flex flex-wrap justify-between items-center gap-4 bg-white/80 backdrop-blur-md px-6 py-4 rounded-2xl shadow-sm border border-white/50 mb-4">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
        <i class="fa-solid fa-graduation-cap text-xl sm:text-2xl"></i>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800">수업용 원판 룰렛</h1>
        <p class="text-xs text-slate-500">공정하고 즐거운 발표자 추첨 웹앱</p>
      </div>
    </div>

    <!-- 우측 상단 제어 버튼들 -->
    <div class="flex items-center gap-2">
      <button id="soundToggleBtn" onclick="toggleSound()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium text-sm transition flex items-center gap-2">
        <i id="soundIcon" class="fa-solid fa-volume-high text-indigo-600"></i>
        <span id="soundText" class="hidden sm:inline">소리 켜짐</span>
      </button>
      <button onclick="toggleSidebar()" class="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl font-medium text-sm transition flex items-center gap-2 border border-indigo-200">
        <i class="fa-solid fa-users-gear"></i>
        <span>명단 설정</span>
      </button>
    </div>
  </header>

  <!-- 메인 영역: 룰렛 원판 및 컨트롤 -->
  <main class="max-w-6xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center my-2">
    
    <!-- 룰렛 보드 (중앙 배치) -->
    <section class="lg:col-span-8 flex flex-col items-center justify-center relative bg-white/60 backdrop-blur-sm p-4 sm:p-8 rounded-3xl shadow-xl border border-white/60 min-h-[480px]">
      
      <!-- 학급 이름 표시 -->
      <div class="mb-4 text-center">
        <span id="currentClassBadge" class="bg-indigo-100 text-indigo-800 text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-full border border-indigo-200">
          1반 학생 목록
        </span>
      </div>

      <!-- 룰렛 그래픽 컨테이너 -->
      <div class="relative flex items-center justify-center p-2">
        <!-- 원판 포인터 (상단 중앙 화살표) -->
        <div class="roulette-pointer absolute top-0 left-1/2 -translate-x-1/2"></div>

        <!-- 캔버스 (원판) -->
        <div class="relative p-2 rounded-full bg-white shadow-2xl border-4 border-slate-100">
          <canvas id="rouletteCanvas" width="420" height="420" class="max-w-full h-auto rounded-full transition-transform duration-300"></canvas>
          
          <!-- 원판 중앙 장식 캡 -->
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 bg-gradient-to-br from-slate-700 to-slate-900 rounded-full border-4 border-white shadow-lg flex items-center justify-center pointer-events-none">
            <i class="fa-solid fa-star text-amber-400 text-lg"></i>
          </div>
        </div>
      </div>

      <!-- 돌리기 버튼 영역 -->
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-md">
        <button id="spinBtn" onclick="spinRoulette()" class="btn-spin w-full sm:w-auto px-10 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xl rounded-2xl flex items-center justify-center gap-3 tracking-wide">
          <i class="fa-solid fa-arrows-spin text-2xl"></i>
          <span>룰렛 돌리기!</span>
        </button>
      </div>

      <!-- 옵션 간편 설정 -->
      <div class="mt-6 flex items-center gap-6 text-sm text-slate-600">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="removeWinnerCheck" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500" checked>
          <span>뽑힌 학생 원판에서 자동 제외</span>
        </label>
      </div>
    </section>

    <!-- 오른쪽 이력 및 통계 패널 -->
    <section class="lg:col-span-4 flex flex-col h-full space-y-4">
      
      <!-- 방금 뽑힌 학생 표시 카드 -->
      <div class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-3xl p-6 shadow-lg border border-indigo-400/30 text-center flex flex-col justify-center items-center min-h-[160px]">
        <span class="text-xs font-semibold text-indigo-200 uppercase tracking-widest mb-1">🎉 당첨된 학생 🎉</span>
        <div id="winnerDisplay" class="text-3xl sm:text-4xl font-extrabold my-2 min-h-[48px] flex items-center justify-center">
           준비 완료!
        </div>
        <p id="winnerSubText" class="text-xs text-indigo-100/80">돌리기 버튼을 눌러주세요</p>
      </div>

      <!-- 당첨 기록 목록 -->
      <div class="bg-white/80 backdrop-blur-md rounded-3xl p-5 shadow-lg border border-white/60 flex-1 flex flex-col min-h-[250px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
          <h2 class="font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-500"></i>
            <span>뽑힌 학생 목록</span>
            <span id="historyCountBadge" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full">0명</span>
          </h2>
          <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-500 transition">
            <i class="fa-solid fa-trash-can mr-1"></i>기록 초기화
          </button>
        </div>
        
        <div id="historyList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-sm">
          <div class="text-center text-slate-400 py-8 text-xs">아직 당첨된 학생이 없습니다.</div>
        </div>
      </div>

    </section>

  </main>

  <!-- 학생 명단 관리 슬라이드 사이드바 -->
  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 right-0 w-full max-w-md h-full bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    
    <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
      <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-user-pen text-indigo-600"></i>
        <span>학생 명단 관리</span>
      </h2>
      <button onclick="toggleSidebar()" class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-500 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <div class="p-5 overflow-y-auto flex-1 space-y-6">
      <!-- 학급 선택 및 추가 -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">학급 선택 / 새 명단</label>
        <div class="flex gap-2">
          <select id="classSelect" onchange="switchClass(this.value)" class="flex-1 border border-slate-300 rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500 bg-white">
          </select>
          <button onclick="addNewClass()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">
            + 새 학급
          </button>
        </div>
      </div>

      <!-- 학생 명단 텍스트 편집기 -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">학생 명단 입력</label>
          <span class="text-xs text-slate-400">줄바꿈(Enter)으로 구분</span>
        </div>
        <textarea id="studentTextarea" rows="10" placeholder="김철수&#10;이영희&#10;박민수..." 
          class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 resize-none font-mono leading-relaxed"></textarea>
      </div>

      <!-- 명단 템플릿 간편 채우기 버튼 -->
      <div class="bg-indigo-50/60 p-4 rounded-2xl border border-indigo-100">
        <span class="text-xs font-bold text-indigo-800 block mb-2">빠른 테스트용 샘플 명단</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="loadPreset(15)" class="text-xs bg-white hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg transition">15명 예시</button>
          <button onclick="loadPreset(25)" class="text-xs bg-white hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg transition">25명 예시</button>
          <button onclick="loadNumberedPreset(20)" class="text-xs bg-white hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg transition">번호(1~20번)</button>
        </div>
      </div>

    </div>

    <!-- 사이드바 하단 저장 버튼 -->
    <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-3">
      <button onclick="saveStudentList()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md flex justify-center items-center gap-2">
        <i class="fa-solid fa-floppy-disk"></i>
        <span>변경사항 적용하기</span>
      </button>
    </div>

  </aside>

  <!-- 당첨 축하 팝업 모달 -->
  <div id="winnerModalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border border-white/50 transform scale-95 transition-transform duration-300" id="winnerModalContent">
      <div class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <span class="text-xs font-bold text-indigo-600 uppercase tracking-widest block mb-1">🎉 축하합니다! 🎉</span>
      <h3 id="modalWinnerName" class="text-4xl font-extrabold text-slate-800 my-3">김철수</h3>
      <p class="text-sm text-slate-500 mb-6">발표 대상자로 선정되었습니다!</p>
      <button onclick="closeWinnerModal()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-base">
        <span>확인</span>
        <i class="fa-solid fa-check"></i>
      </button>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="max-w-6xl w-full mx-auto text-center py-3 text-xs text-slate-400">
    <p>수업을 위한 똑똑하고 예쁜 룰렛 웹앱 • 선생님의 편리한 학급 경영을 응원합니다!</p>
  </footer>

  <!-- 자바스크립트 로직 -->
  <script>
    // --- 1. 상태 및 상수 데이터 ---
    const PALETTE = [
      '#4F46E5', '#7C3AED', '#EC4899', '#F43F5E', 
      '#EF4444', '#F97316', '#F59E0B', '#10B981', 
      '#06B6D4', '#0EA5E9', '#3B82F6', '#6366F1'
    ];

    let currentClassId = 'default_class';
    let classData = {
      'default_class': {
        name: '1반 학생 명단',
        students: ['김민준', '이서연', '박도윤', '최지우', '정예준', '강하은', '조시우', '윤서아', '장건우', '임지안', '한주원', '오하윤']
      }
    };

    let currentStudents = []; // 현재 원판에 활성화된 학생들
    let history = []; // 당첨 이력
    let isSpinning = false;
    let currentAngle = 0; // 원판 현재 회전 각도(라디안)
    let isSoundOn = true;

    // Canvas DOM 레퍼런스 및 2D Context
    let canvas;
    let ctx;

    // --- 2. 초기화 및 웹 오디오(Tone.js) 설정 ---
    window.onload = function() {
      canvas = document.getElementById('rouletteCanvas');
      ctx = canvas.getContext('2d');

      loadLocalStorage();
      updateClassSelectOptions();
      loadCurrentClassStudents();
      drawRoulette();
      updateHistoryUI();
    };

    // 로컬 스토리지 불러오기
    function loadLocalStorage() {
      const savedData = localStorage.getItem('teacher_roulette_classes');
      if (savedData) {
        try {
          classData = JSON.parse(savedData);
        } catch(e) {
          console.error("저장 데이터 로드 실패", e);
        }
      }
    }

    // 로컬 스토리지 저장하기
    function saveToLocalStorage() {
      localStorage.setItem('teacher_roulette_classes', JSON.stringify(classData));
    }

    // 현재 선택된 학급 학생들 로드
    function loadCurrentClassStudents() {
      if (classData[currentClassId]) {
        currentStudents = [...classData[currentClassId].students];
        document.getElementById('currentClassBadge').innerText = classData[currentClassId].name;
        document.getElementById('studentTextarea').value = classData[currentClassId].students.join('\n');
      }
    }

    // --- 3. Sound Effects (Tone.js 기반) ---
    function playClickSound() {
      if (!isSoundOn) return;
      try {
        const synth = new Tone.MembraneSynth().toDestination();
        synth.volume.value = -12;
        synth.triggerAttackRelease("C3", "32n");
      } catch(e){}
    }

    function playWinFanfare() {
      if (!isSoundOn) return;
      try {
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();
        synth.volume.value = -6;
        const now = Tone.now();
        synth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
        synth.triggerAttackRelease(["G4", "B4", "D5", "G5"], "4n", now + 0.25);
      } catch(e){}
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const soundIcon = document.getElementById('soundIcon');
      const soundText = document.getElementById('soundText');
      
      if (isSoundOn) {
        soundIcon.className = "fa-solid fa-volume-high text-indigo-600";
        soundText.innerText = "소리 켜짐";
      } else {
        soundIcon.className = "fa-solid fa-volume-xmark text-slate-400";
        soundText.innerText = "음소거";
      }
    }

    // --- 4. 룰렛 그래픽 렌더링 (Canvas) ---
    function drawRoulette() {
      if (!canvas || !ctx) return;

      const numSegments = currentStudents.length;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = centerX - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSegments === 0) {
        // 학생이 없을 때 안내 렌더링
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#f1f5f9';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 18px "Gowun Dodum", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('명단 설정에서 학생을 추가해주세요', centerX, centerY);
        return;
      }

      const arcSize = (2 * Math.PI) / numSegments;

      // 룰렛 조각 그리기
      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arcSize;

        // 조각 배경
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();

        // 조각 경계선
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // 텍스트 출력
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';

        // 인원수에 따른 폰트 크기 자동 조절
        let fontSize = 18;
        if (numSegments > 20) fontSize = 12;
        else if (numSegments > 12) fontSize = 14;

        ctx.font = `bold ${fontSize}px "Gowun Dodum", sans-serif`;
        
        // 이름 텍스트 그림자 효과
        ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
        ctx.shadowBlur = 4;

        // 원판 가장자리 안쪽에 이름 배치
        ctx.fillText(currentStudents[i], radius - 24, 6);
        ctx.restore();
      }

      // 외곽 테두리 링
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    // --- 5. 룰렛 회전 애니메이션 로직 ---
    function spinRoulette() {
      if (isSpinning) return;
      if (currentStudents.length === 0) {
        alert('추첨할 학생이 없습니다. 우측 상단 "명단 설정"에서 학생을 추가해주세요!');
        return;
      }

      // Tone.js Audio Context 활성화
      if (typeof Tone !== 'undefined' && Tone.start) {
        Tone.start();
      }

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      const winnerDisplay = document.getElementById('winnerDisplay');
      const winnerSubText = document.getElementById('winnerSubText');
      winnerDisplay.innerText = "두구두구...";
      winnerSubText.innerText = "과연 누구일까요?";

      // 기본 회전수(8~12바퀴) + 랜덤 각도
      const extraRounds = 8 + Math.floor(Math.random() * 5);
      const randomTargetAngle = Math.random() * Math.PI * 2;
      const totalRotation = extraRounds * Math.PI * 2 + randomTargetAngle;

      const duration = 4500; // 회전 시간 (4.5초)
      const startTimestamp = performance.now();
      const initialAngle = currentAngle;

      let lastTickSegment = -1;
      const numSegments = currentStudents.length;
      const arcSize = (2 * Math.PI) / numSegments;

      function animate(now) {
        const elapsed = now - startTimestamp;
        const progress = Math.min(elapsed / duration, 1);

        // Ease-out (Cubic) 감속 공식 적용
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = initialAngle + totalRotation * easeOut;

        // 원판 화살표 틱(Tick) 효과음 처리
        const normalizedAngle = (3 * Math.PI / 2 - (currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const currentSegment = Math.floor(normalizedAngle / arcSize);
        if (currentSegment !== lastTickSegment) {
          playClickSound();
          lastTickSegment = currentSegment;
        }

        drawRoulette();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          finishSpin(normalizedAngle);
        }
      }

      requestAnimationFrame(animate);
    }

    // 회전 완료 후 처리
    function finishSpin(normalizedAngle) {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;

      const numSegments = currentStudents.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const winnerIndex = Math.floor(normalizedAngle / arcSize);
      const winnerName = currentStudents[winnerIndex];

      // 당첨자 텍스트 및 효과음/폭죽
      document.getElementById('winnerDisplay').innerText = winnerName;
      document.getElementById('winnerSubText').innerText = "축하합니다! 발표를 시작해주세요.";

      playWinFanfare();
      triggerConfetti();

      // 당첨 팝업 모달 띄우기
      showWinnerModal(winnerName);

      // 히스토리에 추가
      addToHistory(winnerName);

      // 옵션: 자동 제외 체크 시 원판에서 제거
      const shouldRemove = document.getElementById('removeWinnerCheck').checked;
      if (shouldRemove) {
        setTimeout(() => {
          currentStudents.splice(winnerIndex, 1);
          drawRoulette();
        }, 1200);
      }
    }

    // 당첨 모달 제어 함수
    function showWinnerModal(name) {
      const modal = document.getElementById('winnerModalOverlay');
      const nameEl = document.getElementById('modalWinnerName');
      nameEl.innerText = name;
      modal.classList.remove('hidden');
    }

    function closeWinnerModal() {
      const modal = document.getElementById('winnerModalOverlay');
      modal.classList.add('hidden');
    }

    // 당첨 폭죽 효과 (Canvas Confetti)
    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // --- 6. 당첨 이력(History) 관리 ---
    function addToHistory(name) {
      const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      history.unshift({ name, time: timeStr });
      updateHistoryUI();
    }

    function updateHistoryUI() {
      const historyListEl = document.getElementById('historyList');
      const countBadge = document.getElementById('historyCountBadge');

      countBadge.innerText = `${history.length}명`;

      if (history.length === 0) {
        historyListEl.innerHTML = `<div class="text-center text-slate-400 py-8 text-xs">아직 당첨된 학생이 없습니다.</div>`;
        return;
      }

      historyListEl.innerHTML = history.map((item, index) => `
        <div class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl transition border border-slate-100">
          <div class="flex items-center gap-3">
            <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center">
              ${history.length - index}
            </span>
            <span class="font-bold text-slate-800 text-base">${item.name}</span>
          </div>
          <span class="text-[11px] text-slate-400 font-mono">${item.time}</span>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (history.length === 0) return;
      if (confirm('당첨 기록을 모두 삭제하시겠습니까?')) {
        history = [];
        updateHistoryUI();
      }
    }

    // --- 7. 명단 설정 사이드바 및 데이터 관리 ---
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      const isOpen = !sidebar.classList.contains('translate-x-full');
      
      if (isOpen) {
        sidebar.classList.add('translate-x-full');
        overlay.classList.add('hidden');
      } else {
        sidebar.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
      }
    }

    function updateClassSelectOptions() {
      const select = document.getElementById('classSelect');
      select.innerHTML = Object.keys(classData).map(id => `
        <option value="${id}" ${id === currentClassId ? 'selected' : ''}>
          ${classData[id].name} (${classData[id].students.length}명)
        </option>
      `).join('');
    }

    function switchClass(classId) {
      currentClassId = classId;
      loadCurrentClassStudents();
      drawRoulette();
    }

    function addNewClass() {
      const name = prompt('새 학급 이름을 입력하세요 (예: 2반, 동아리):');
      if (!name) return;
      
      const newId = 'class_' + Date.now();
      classData[newId] = {
        name: name,
        students: ['학생1', '학생2', '학생3', '학생4', '학생5']
      };
      
      saveToLocalStorage();
      updateClassSelectOptions();
      switchClass(newId);
    }

    function saveStudentList() {
      const text = document.getElementById('studentTextarea').value;
      const lines = text.split('\n')
                        .map(s => s.trim())
                        .filter(s => s.length > 0);

      if (lines.length === 0) {
        alert('최소 1명 이상의 학생 이름을 입력해야 합니다.');
        return;
      }

      classData[currentClassId].students = lines;
      currentStudents = [...lines];
      
      saveToLocalStorage();
      updateClassSelectOptions();
      drawRoulette();
      toggleSidebar();

      document.getElementById('winnerDisplay').innerText = "준비 완료!";
      document.getElementById('winnerSubText').innerText = "명단이 업데이트되었습니다.";
    }

    // 명단 샘플 템플릿 로더
    function loadPreset(count) {
      const names = [
        "김민준", "이서연", "박도윤", "최지우", "정예준", "강하은", "조시우", "윤서아", 
        "장건우", "임지안", "한주원", "오하윤", "서진우", "신수아", "권민재", "황유나",
        "송현우", "류채원", "전준영", "고다은", "문성민", "양지원", "손승현", "배소율", "백지후"
      ];
      document.getElementById('studentTextarea').value = names.slice(0, count).join('\n');
    }

    function loadNumberedPreset(count) {
      const list = [];
      for (let i = 1; i <= count; i++) {
        list.push(`${i}번 학생`);
      }
      document.getElementById('studentTextarea').value = list.join('\n');
    }
  </script>
</body>
